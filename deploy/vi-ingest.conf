# Публичный URL: https://vi-ingest.abacusai.cloud  ->  server_name vi-ingest.vm.internal
# Приём данных ВИ с внешнего «хорошего-IP» хоста (ingest_service на 127.0.0.1:8077).
server {
    listen 80;
    server_name vi-ingest.vm.internal;

    # Не кэшировать приёмные ответы на границе.
    add_header Cache-Control "no-store" always;

    # Никогда не отдавать dotfiles.
    location ~ /\. { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        client_max_body_size 32m;
    }
}
